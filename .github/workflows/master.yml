name: master nightly

on:
  push:
    branches:
      - master
    tags:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_upload:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            artifact_name: nightly-apk
            artifact_path: build/app/outputs/flutter-apk/*.apk
          - target: ios
            os: macos-latest
            artifact_name: nightly-ios
            artifact_path: build/*.ipa

    env:
      # flutter-action reads the SDK version from .fvmrc. Use its Flutter
      # installation instead of installing a second SDK via FVM.
      BOORUSAMA_USE_FVM: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Cache Gradle packages
        if: matrix.target == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Install Linux native build tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y meson ninja-build nasm

      - name: Install macOS native build tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install meson ninja nasm

      - name: Check native build tools
        shell: bash
        run: |
          set -euo pipefail
          meson --version
          ninja --version
          nasm --version

      - name: Show toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version

      - name: Decode keystore (Android)
        if: matrix.target == 'android'
        shell: bash
        env:
          ENCODED_KEYSTORE: ${{ secrets.ENCODED_KEYSTORE }}
        run: |
          set -euo pipefail
          : "${ENCODED_KEYSTORE:?ENCODED_KEYSTORE secret is required for Android builds}"
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > android/app/key.jks

      - name: Create key.properties (Android)
        if: matrix.target == 'android'
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_PASSWORD:?KEYSTORE_PASSWORD secret is required for Android builds}"
          : "${KEY_PASSWORD:?KEY_PASSWORD secret is required for Android builds}"
          : "${KEY_ALIAS:?KEY_ALIAS secret is required for Android builds}"
          cat > android/key.properties <<EOF_KEY_PROPERTIES
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=key.jks
          EOF_KEY_PROPERTIES

      - name: Initialize workspace
        shell: bash
        run: |
          set -euo pipefail
          ./init.sh

      - name: Get app metadata
        id: app_metadata
        shell: bash
        run: |
          set -euo pipefail
          app_name="$(sed -nE 's/^name:[[:space:]]*([^[:space:]#]+).*/\1/p' pubspec.yaml | head -n 1)"
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' pubspec.yaml | head -n 1)"
          : "${app_name:?pubspec.yaml must contain a name}"
          : "${version:?pubspec.yaml must contain a version}"
          printf 'app_name=%s\nversion=%s\n' "$app_name" "$version" >> "$GITHUB_OUTPUT"

      - name: Build APKs (Android)
        if: matrix.target == 'android'
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --flavor prod --dart-define-from-file env/prod.json
          mv build/app/outputs/flutter-apk/app-prod-release.apk \
            "build/app/outputs/flutter-apk/${{ steps.app_metadata.outputs.app_name }}_${{ steps.app_metadata.outputs.version }}.apk"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_FILE: key.jks

      - name: Build release (iOS)
        if: matrix.target == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign --flavor prod --dart-define-from-file env/prod.json -t lib/main.dart

      - name: Build IPA (iOS)
        if: matrix.target == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/ios/iphoneos/Boorusama.app build/Payload/Boorusama.app
          (
            cd build
            zip -r "${{ steps.app_metadata.outputs.app_name }}_${{ steps.app_metadata.outputs.version }}.ipa" Payload
          )
          rm -rf build/Payload

      - name: Publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove Android signing files
        if: always() && matrix.target == 'android'
        shell: bash
        run: rm -f android/app/key.jks android/key.properties

  publish_release:
    if: startsWith(github.ref, 'refs/tags/')
    name: Publish tag release
    needs: build_and_upload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Prepare release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' pubspec.yaml | head -n 1)"
          : "${version:?pubspec.yaml must contain a version}"
          version_name="${version%%+*}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v heading="# $version_name" '
            $0 == heading { found = 1; next }
            found && /^# / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$notes_file"
          test -s "$notes_file"
          printf 'version=%s\nnotes_file=%s\n' "$version" "$notes_file" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ runner.temp }}/artifacts/nightly-apk/*.apk,${{ runner.temp }}/artifacts/nightly-ios/*.ipa
          tag: ${{ github.ref_name }}
          bodyFile: ${{ steps.release_notes.outputs.notes_file }}
          prerelease: ${{ contains(github.ref_name, 'pre') }}
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true